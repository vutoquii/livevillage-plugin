plugins {
    id 'java'
}

group = 'com.vutocorp.livevillage'
version = '0.1.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.87-stable'
    // Gson lo trae el servidor (lo usa Minecraft por dentro): compileOnly, no se empaqueta.
    // Se mantiene JSON para el catalogo de modelos y la tabla de regalos, igual que el mod,
    // para que un config existente se pueda copiar tal cual.
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

jar {
    archiveFileName = "livevillage-plugin-${version}.jar"
}

// El expand() SOLO sobre plugin.yml. Si se aplica a todos los recursos destroza los
// .nbt: son binarios y el filtro los reescribe como texto.
processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}
