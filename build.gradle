plugins {
    id 'java'
    id 'io.papermc.hangar-publish-plugin' version '0.1.4'
}

group = 'com.vutocorp.livevillage'
version = '0.2.0'
// Version de Minecraft con la que publicar en Hangar. Separada de 'version' del plugin
// por el mismo motivo que en el mod: si Hangar algun dia soporta varias versiones de
// Minecraft a la vez para este plugin, se toca solo esta linea.
ext.hangar_mc_version = '1.21.4'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.87-stable'
    // Gson lo trae el servidor (lo usa Minecraft por dentro): compileOnly, no se empaqueta.
    // Se mantiene JSON para el catalogo de modelos y la tabla de regalos, igual que el mod,
    // para que un config existente se pueda copiar tal cual.
    compileOnly 'com.google.code.gson:gson:2.11.0'
}

jar {
    archiveFileName = "livevillage-plugin-${version}.jar"
}

// El expand() SOLO sobre plugin.yml. Si se aplica a todos los recursos destroza los
// .nbt: son binarios y el filtro los reescribe como texto.
processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(project.properties)
    }
}

// Publicacion en Hangar (el CurseForge de los plugins Paper).
// https://hangar.papermc.io/Vutoquii/LiveVillages
hangarPublish {
    publications.register('plugin') {
        version = project.version
        channel = 'Release'
        id = 'LiveVillages'
        apiKey = providers.environmentVariable('HANGAR_API_KEY')
        platforms {
            paper {
                jar = tasks.named('jar').flatMap { it.archiveFile }
                platformVersions.add(hangar_mc_version)
            }
        }
    }
}
